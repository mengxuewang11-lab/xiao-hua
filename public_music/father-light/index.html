<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>父亲的光</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1d1b18;
      --muted: #6d665e;
      --line: #ddd4c8;
      --surface: #fffaf3;
      --accent: #9a5b28;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(154, 91, 40, 0.16), rgba(255, 255, 255, 0) 38%),
        linear-gradient(315deg, rgba(44, 98, 118, 0.12), rgba(255, 255, 255, 0) 45%),
        var(--surface);
    }

    main {
      width: min(100%, 520px);
      padding: 32px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 18px 46px rgba(81, 62, 42, 0.14);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(30px, 9vw, 52px);
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
    }

    audio {
      width: 100%;
      display: block;
      margin-top: 6px;
    }

    a {
      display: inline-block;
      margin-top: 18px;
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>父亲的光</h1>
    <p>点击播放，聆听这首歌。</p>
    <audio controls preload="metadata" src="./father-light.mp3"></audio>
    <a href="./father-light.mp3" download>下载音频</a>
  </main>
</body>
</html>
