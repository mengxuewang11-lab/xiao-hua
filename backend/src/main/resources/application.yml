spring:
  application:
    name: novel-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/novel_master?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:novel_app}
    password: ${DB_PASSWORD:Ww10106681@}
    hikari:
      connection-timeout: 5000
      validation-timeout: 3000
      maximum-pool-size: 10
      minimum-idle: 1
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}
  security:
    auth-enabled: ${APP_AUTH_ENABLED:false}
    development-token: ${APP_AUTH_TOKEN:}
  ai:
    provider: ${MODEL_PROVIDER:fake}
    chat:
      default-provider: ${CHAT_MODEL_PROVIDER:zhipu}
      default-model: ${CHAT_MODEL_NAME:glm-4.7-flash}
      timeout-seconds: ${CHAT_MODEL_TIMEOUT_SECONDS:90}
      providers:
        zhipu:
          display-name: 智谱 GLM
          base-url: ${ZHIPU_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
          api-key: ${ZHIPU_API_KEY:a71a94cc8f97484d826400cedcdf9e05.9H3MXPKUthZ04jKh}
          models:
            "[glm-4.7-flash]":
              display-name: GLM-4.7-Flash
              free-tier: true
              description: 智谱官方免费文本模型，适合作为小说工坊默认对话模型。
            glm-4-flash-250414:
              display-name: GLM-4-Flash-250414
              free-tier: true
              description: 智谱免费文本模型，可作为备用轻量模型。
        kimi:
          display-name: Kimi
          base-url: ${KIMI_BASE_URL:https://api.moonshot.ai/v1}
          api-key: ${KIMI_API_KEY:sk-LcTu2FIrdfctwUpW5SnccpXWCc9qxafvn5lK4AaehGREEMBV}
          models:
            "[kimi-k2.6]":
              display-name: Kimi K2.6
              free-tier: false
              description: Moonshot Kimi 官方示例模型，是否免费取决于账号额度与平台策略。
  test-endpoints:
    enabled: ${TEST_ENDPOINTS_ENABLED:true}
