<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>父亲的光</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #fff9ef;
      --muted: rgba(255, 249, 239, 0.78);
      --line: rgba(255, 255, 255, 0.2);
      --accent: #ffdca8;
      --panel: rgba(12, 10, 8, 0.58);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 26px 20px 36px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: #14120f url("./background.png") center / cover no-repeat fixed;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(12, 10, 8, 0.12) 0%, rgba(12, 10, 8, 0.44) 40%, rgba(12, 10, 8, 0.86) 100%),
        radial-gradient(circle at 50% 18%, rgba(255, 218, 163, 0.24), rgba(20, 18, 15, 0) 38%);
      pointer-events: none;
    }

    main {
      width: min(100%, 540px);
      min-height: calc(100vh - 62px);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      position: relative;
      z-index: 1;
    }

    .player {
      padding: 22px 0 18px;
      border-top: 1px solid var(--line);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(38px, 12vw, 68px);
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: 0;
      text-shadow: 0 3px 18px rgba(0, 0, 0, 0.42);
    }

    p {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
    }

    audio {
      width: 100%;
      display: block;
      margin-top: 6px;
      accent-color: var(--accent);
    }

    a {
      display: inline-block;
      margin-top: 14px;
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
    }

    .tagline {
      max-width: 24em;
    }

    .lyrics {
      height: min(46vh, 420px);
      margin-top: 18px;
      padding: 18px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      backdrop-filter: blur(10px);
      box-shadow: 0 18px 46px rgba(0, 0, 0, 0.22);
      scroll-behavior: smooth;
    }

    .lyrics-title {
      position: sticky;
      top: -18px;
      margin: -18px -18px 10px;
      padding: 14px 18px 10px;
      background: linear-gradient(180deg, rgba(12, 10, 8, 0.92), rgba(12, 10, 8, 0));
      font-size: 14px;
      font-weight: 700;
      color: var(--accent);
      z-index: 1;
    }

    .line {
      margin: 0;
      padding: 6px 0;
      color: rgba(255, 249, 239, 0.58);
      font-size: 17px;
      line-height: 1.75;
      transition: color 160ms ease, transform 160ms ease, opacity 160ms ease;
    }

    .line.active {
      color: #fff9ef;
      font-weight: 800;
      transform: translateX(4px);
      text-shadow: 0 2px 16px rgba(255, 220, 168, 0.22);
    }

    .line.past {
      color: rgba(255, 249, 239, 0.36);
    }

    .status {
      min-height: 22px;
      margin-top: 10px;
      color: rgba(255, 249, 239, 0.68);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <section class="player">
      <h1>父亲的光</h1>
      <p class="tagline">愿这束温暖的光，陪你慢慢听完这一首歌。</p>
      <audio id="audio" controls preload="auto" crossorigin="anonymous">
        <source src="https://cdn.jsdelivr.net/gh/mengxuewang11-lab/xiao-hua@1061a61f17fb6ea0f1b9bef22be62c3959db675c/public_music/father-light/father-light.mp3" type="audio/mpeg">
        <source src="./father-light.mp3" type="audio/mpeg">
      </audio>
      <div id="status" class="status">加载音频中...</div>
      <a href="./father-light.mp3" download>下载音频</a>
      <section id="lyrics" class="lyrics" aria-label="歌词">
        <div class="lyrics-title">歌词</div>
      </section>
    </section>
  </main>

  <script>
    const lyrics = [
      [8, "他很少说起辛苦"],
      [15, "只把沉默留在肩膀"],
      [22, "风吹过旧时的路"],
      [29, "他走得比谁都稳当"],
      [38, "时间把话说得很轻"],
      [45, "却在皱纹里留下回响"],
      [52, "那些没说出口的期望"],
      [60, "都藏在目光的远方"],
      [70, "父亲的光 不喧哗地亮"],
      [77, "像一盏灯 在夜里守望"],
      [84, "不说永远 却一直在场"],
      [91, "陪我走过 每段成长"],
      [99, "父亲的光 不张扬的暖"],
      [106, "像一双手 托住重量"],
      [113, "岁月很长 他却很短"],
      [121, "留给我的 是方向"],
      [133, "他习惯把累藏起来"],
      [140, "只把安心留给身旁"],
      [147, "我慢慢学会理解"],
      [154, "那些沉默里的回答"],
      [163, "有些爱不用表达"],
      [170, "却早已写进日常"],
      [177, "在我回头的每一刻"],
      [184, "他都站在来路上"],
      [194, "父亲的光 不喧哗地亮"],
      [201, "像一盏灯 在夜里守望"],
      [208, "不说永远 却一直在场"],
      [215, "陪我走过 每段成长"],
      [223, "父亲的光 不张扬的暖"],
      [230, "像一双手 托住重量"],
      [237, "岁月很长 他却很短"],
      [244, "留给我的 是方向"],
      [252, "如果时间会慢一点"],
      [256, "我想多看他一眼"],
      [260, "那沉默的身影里"],
      [263, "藏着整个世界的温暖"]
    ];

    const audio = document.getElementById("audio");
    const box = document.getElementById("lyrics");
    const status = document.getElementById("status");
    const title = box.querySelector(".lyrics-title");
    let activeIndex = -1;

    lyrics.forEach(([time, text], index) => {
      const line = document.createElement("p");
      line.className = "line";
      line.dataset.time = time;
      line.dataset.index = index;
      line.textContent = text;
      line.addEventListener("click", () => {
        audio.currentTime = time;
        audio.play().catch(() => {});
      });
      box.appendChild(line);
    });

    const lines = [...box.querySelectorAll(".line")];

    function setActive(index) {
      if (index === activeIndex || index < 0) return;
      activeIndex = index;
      lines.forEach((line, i) => {
        line.classList.toggle("active", i === index);
        line.classList.toggle("past", i < index);
      });
      const line = lines[index];
      const target = line.offsetTop - title.offsetHeight - (box.clientHeight * 0.38);
      box.scrollTo({ top: Math.max(0, target), behavior: "smooth" });
    }

    function updateLyrics() {
      const t = audio.currentTime || 0;
      let next = 0;
      for (let i = 0; i < lyrics.length; i += 1) {
        if (t >= lyrics[i][0]) next = i;
        else break;
      }
      setActive(next);
    }

    audio.addEventListener("loadedmetadata", () => {
      status.textContent = "音频已就绪";
      updateLyrics();
    });

    audio.addEventListener("canplay", () => {
      status.textContent = "可以播放";
    });

    audio.addEventListener("waiting", () => {
      status.textContent = "网络缓冲中...";
    });

    audio.addEventListener("playing", () => {
      status.textContent = "正在播放";
    });

    audio.addEventListener("error", () => {
      status.textContent = "当前网络加载失败，请点下载音频或稍后重试";
    });

    audio.addEventListener("timeupdate", updateLyrics);
    audio.addEventListener("seeked", updateLyrics);
    setActive(0);
  </script>
</body>
</html>
